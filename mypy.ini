[mypy]
python_version = 3.12
explicit_package_bases = True
show_error_codes = True
warn_unused_ignores = True

# 新代码使用严格模式
[mypy-services.ftp_service]
strict = True

[mypy-services.smb_service]
strict = True

[mypy-ui.tabs.smb_tab]
strict = True

# 第三方库 - 跳过未安装的 stub
[mypy-pyftpdlib.*]
ignore_missing_imports = True

[mypy-paramiko.*]
ignore_missing_imports = True

[mypy-smb.*]
ignore_missing_imports = True
